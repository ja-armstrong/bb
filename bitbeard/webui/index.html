<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <!-- USER-FACING -->
    <title>Bitbeard</title>
</head>
<body>
    <header>
        <!-- USER-FACING -->
        <div class="logo">Bitbeard</div>
        <!-- USER-FACING -->
        <div class="subtitle">Remember kids, if buying a movie doesn't mean you own it, then downloading it from me doesn't mean you're stealing it!</div>
    </header>
    <main>
        <!-- Shown whenever the API refuses the Session (not logged in / expired). -->
        <div class="section login-card" id="login-view">
            <!-- USER-FACING -->
            <h2>Log in</h2>
            <form id="login-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" required autocomplete="username">
                <!-- USER-FACING -->
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required autocomplete="current-password">
                <!-- USER-FACING -->
                <button type="submit">Log in</button>
                <div id="login-message" aria-live="polite"></div>
            </form>
            <p>
                <!-- USER-FACING -->
                <a href="/register">Request an account</a>
            </p>
        </div>

        <div id="app-view" hidden>
            <div class="userbar">
                <span id="quota-info"></span>
                <span id="userbar-info"></span>
                <!-- USER-FACING -->
                <button id="logout-btn">Log out</button>
            </div>
            <div class="section">
                <!-- USER-FACING -->
                <h2>Search Torrents</h2>
            <form id="search-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="search-query">Query:</label>
                <!-- USER-FACING -->
                <input type="text" id="search-query" required placeholder="anything your heart desires">
                <!-- USER-FACING -->
                <button type="submit">Search</button>
            </form>
            <div class="results" id="search-results"></div>
            <div class="pagination">
                <!-- USER-FACING -->
                <button id="prev-page" hidden>&lt; Prev</button>
                <span id="page-info"></span>
                <!-- USER-FACING -->
                <button id="next-page" hidden>Next &gt;</button>
            </div>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>Download Torrent</h2>
            <form id="download-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="magnet-link">Magnet Link:</label>
                <!-- USER-FACING -->
                <textarea id="magnet-link" rows="2" required placeholder="Paste magnet link here"></textarea>
                <!-- USER-FACING -->
                <label for="category">Category:</label>
                <select id="category" required>
                    <!-- USER-FACING -->
                    <option value="" disabled selected>Select category</option>
                    <!-- USER-FACING -->
                    <option value="Movie">Movie</option>
                    <!-- USER-FACING -->
                    <option value="TV Show">TV Show</option>
                    <!-- USER-FACING -->
                    <option value="Other">Other</option>
                    <!-- USER-FACING -->
                    <option value="Audiobook">Audiobook</option>
                </select>
                <!-- USER-FACING -->
                <button type="submit">Download</button>
            </form>
            <div id="download-message" aria-live="polite"></div>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>My Media</h2>
            <!-- USER-FACING -->
            <button id="refresh-media">Refresh My Media</button>
            <div id="mymedia-message" aria-live="polite"></div>
            <div class="results" id="media-list"></div>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>Download Progress</h2>
            <!-- USER-FACING -->
            <button id="refresh-progress">Refresh Progress</button>
            <div class="progress-list" id="progress-list"></div>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>Cancel All Downloads</h2>
            <!-- USER-FACING -->
            <button id="cancel-btn">Cancel All</button>
            <div id="cancel-message" aria-live="polite"></div>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>Change Password</h2>
            <form id="password-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="current-password">Current password:</label>
                <input type="password" id="current-password" required autocomplete="current-password">
                <!-- USER-FACING -->
                <label for="new-password">New password:</label>
                <input type="password" id="new-password" minlength="8" required autocomplete="new-password">
                <!-- USER-FACING -->
                <button type="submit">Change password</button>
                <div id="password-message" aria-live="polite"></div>
            </form>
        </div>
        <div class="section">
            <!-- USER-FACING -->
            <h2>Link Discord</h2>
            <form id="link-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="link-discord-id">Your Discord user ID:</label>
                <!-- USER-FACING -->
                <input type="text" id="link-discord-id" required placeholder="e.g. 123456789012345678">
                <!-- USER-FACING -->
                <button type="submit">Generate Link Code</button>
                <div id="link-message" aria-live="polite"></div>
            </form>
        </div>
        </div>
    </main>
    <script>
        // --- API base is fixed to same-origin reverse proxy ---
        const API_BASE = "/api";

        // --- Session-aware views -------------------------------------
        // The API owns authentication (HTTP-only cookie); the Webui simply
        // asks /auth/me and shows the login page until it answers.
        const loginView = document.getElementById('login-view');
        const appView = document.getElementById('app-view');

        function showLogin() {
            appView.hidden = true;
            loginView.hidden = false;
        }

        async function showApp() {
            try {
                const resp = await fetch(`${API_BASE}/auth/me`);
                if (!resp.ok) {
                    showLogin();
                    return;
                }
                const me = await resp.json();
                document.getElementById('userbar-info').textContent =
                    <!-- USER-FACING -->
                    `Logged in as ${me.username} (${me.role})`;
                loginView.hidden = true;
                appView.hidden = false;
                loadQuota();
                loadProgress();
                loadMedia();
            } catch (err) {
                showLogin();
            }
        }

        // --- Storage Quota ---------------------------------------------
        // The API pre-checks every submission against the Account's cap;
        // the usage-vs-cap line is shown here and a rejection is rendered
        // inline on the download form (see the download submit handler).
        function fmtGB(bytes) {
            <!-- USER-FACING -->
            return `${(Number(bytes || 0) / (1024 ** 3)).toFixed(1)} GB`;
        }

        function formatQuota(q) {
            <!-- USER-FACING -->
            if (q.exempt) return `Storage: ${fmtGB(q.used_bytes)} (no cap)`;
            <!-- USER-FACING -->
            if (q.unlimited) return `Storage: ${fmtGB(q.used_bytes)} (unlimited)`;
            <!-- USER-FACING -->
            return `Storage: ${fmtGB(q.used_bytes)} of ${fmtGB(q.cap_bytes)}`;
        }

        async function loadQuota() {
            const el = document.getElementById('quota-info');
            try {
                const resp = await fetch(`${API_BASE}/me/quota`);
                if (handleAuthFailure(resp)) return;
                if (!resp.ok) { el.textContent = ""; return; }
                el.textContent = formatQuota(await resp.json());
            } catch (err) {
                el.textContent = "";
            }
        }

        // Route any 401 from a data call back to the login page.
        function handleAuthFailure(resp) {
            if (resp.status === 401) {
                showLogin();
                return true;
            }
            return false;
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('login-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Logging in...";
            try {
                const resp = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                if (resp.ok) {
                    msgDiv.textContent = "";
                    showApp();
                } else {
                    const data = await resp.json().catch(() => ({}));
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Login failed"}</span>`;
                }
            } catch (err) {
                <!-- USER-FACING -->
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async function() {
            await fetch(`${API_BASE}/auth/logout`, { method: "POST" }).catch(() => {});
            showLogin();
        });

        document.getElementById('password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('password-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Updating...";
            try {
                const resp = await fetch(`${API_BASE}/auth/password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        current_password: document.getElementById('current-password').value,
                        new_password: document.getElementById('new-password').value
                    })
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json().catch(() => ({}));
                if (resp.ok) {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="success">Password updated.</span>`;
                    document.getElementById('password-form').reset();
                } else {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Failed to change password"}</span>`;
                }
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        // --- Link Discord ------------------------------------------------
        // A one-time Link Code binds this Account to the Discord ID
        // entered here. The code is only claimed — the binding itself is
        // verified when that Discord user next interacts with the Bot,
        // so a stolen code alone cannot hijack the link.
        document.getElementById('link-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('link-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Generating...";
            try {
                const resp = await fetch(`${API_BASE}/link/code`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        discord_id: document.getElementById('link-discord-id').value.trim()
                    })
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json().catch(() => ({}));
                if (resp.ok) {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="success">Link Code <strong>${data.code}</strong> generated for Discord ID ${data.discord_id}. Send any message to the Bot from Discord to finish linking.</span>`;
                } else {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Failed to generate Link Code"}</span>`;
                }
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        // Initial load: prove the Session before revealing the app.
        showApp();

        // --- Search with pagination and extra info ---
        const RESULTS_PER_PAGE = 10;
        let searchResults = [];
        let currentPage = 1;

        function renderSearchResults() {
            const resultsDiv = document.getElementById('search-results');
            const pageInfo = document.getElementById('page-info');
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            if (!searchResults.length) {
                <!-- USER-FACING -->
                resultsDiv.innerHTML = "<em>No results found.</em>";
                pageInfo.textContent = "";
                prevBtn.hidden = true;
                nextBtn.hidden = true;
                return;
            }
            const totalPages = Math.ceil(searchResults.length / RESULTS_PER_PAGE);
            currentPage = Math.max(1, Math.min(currentPage, totalPages));
            const start = (currentPage - 1) * RESULTS_PER_PAGE;
            const end = start + RESULTS_PER_PAGE;
            const pageResults = searchResults.slice(start, end);

            resultsDiv.innerHTML = pageResults.map((r, i) => {
                // The absolute index into searchResults, so the Download
                // button can hand the form this result's size and title.
                const resultIndex = start + i;
                <!-- USER-FACING -->
                return `
                    <div class="torrent">
                        <div><strong>${r.title}</strong></div>
                        <div>
                            <button onclick="copyMagnet('${r.magnet_link.replace(/'/g, "\\'")}')">Copy Magnet</button>
                            <button onclick="prefillDownload(${resultIndex})">Download</button>
                        </div>
                        <div class="magnet-link">${r.magnet_link}</div>
                        <div class="torrent-info">
                            Size: ${Number(r.size_gb).toFixed(2)} GB &nbsp;|&nbsp; Seeders: ${r.seeders}
                        </div>
                    </div>
                `;
            }).join('');
            <!-- USER-FACING -->
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevBtn.hidden = currentPage <= 1;
            nextBtn.hidden = currentPage >= totalPages;
        }

        document.getElementById('search-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const query = document.getElementById('search-query').value;
            const resultsDiv = document.getElementById('search-results');
            const pageInfo = document.getElementById('page-info');
            <!-- USER-FACING -->
            resultsDiv.innerHTML = "Searching...";
            pageInfo.textContent = "";
            searchResults = [];
            currentPage = 1;
            try {
                const resp = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (data.results && data.results.length > 0) {
                    searchResults = data.results;
                    currentPage = 1;
                    renderSearchResults();
                } else {
                    resultsDiv.innerHTML = "<em>No results found.</em>";
                    pageInfo.textContent = "";
                }
            } catch (err) {
                resultsDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
                pageInfo.textContent = "";
            }
        });

        document.getElementById('prev-page').addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                renderSearchResults();
            }
        });
        document.getElementById('next-page').addEventListener('click', function() {
            const totalPages = Math.ceil(searchResults.length / RESULTS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                renderSearchResults();
            }
        });

        // Download
        // When the magnet came from a search result, its Torznab size and
        // title ride along so the API's quota pre-check and the manager's
        // ownership record have the real numbers. Pasting a magnet by hand
        // resets them (size unknown until the torrent completes).
        let pendingSizeBytes = 0;
        let pendingTitle = null;

        document.getElementById('magnet-link').addEventListener('input', function() {
            pendingSizeBytes = 0;
            pendingTitle = null;
        });

        document.getElementById('download-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const magnet_link = document.getElementById('magnet-link').value.trim();
            const categorySelect = document.getElementById('category');
            const category = categorySelect.value;
            const msgDiv = document.getElementById('download-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Starting download...";
            try {
                const resp = await fetch(`${API_BASE}/download`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        magnet_link,
                        category,
                        size_bytes: pendingSizeBytes,
                        title: pendingTitle
                    })
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (resp.ok) {
                    msgDiv.innerHTML = `<span class="success">${data.message}</span>`;
                    pendingSizeBytes = 0;
                    pendingTitle = null;
                    loadQuota();
                } else {
                    // Includes the inline "quota exceeded" state: the API's
                    // rejection message is shown right on the form.
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Failed to start download"}</span>`;
                }
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        // Progress
        async function loadProgress() {
            const progressDiv = document.getElementById('progress-list');
            <!-- USER-FACING -->
            progressDiv.innerHTML = "Loading...";
            try {
                const resp = await fetch(`${API_BASE}/progress`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (data.progress && data.progress.length > 0) {
                    <!-- USER-FACING -->
                    progressDiv.innerHTML = data.progress.map(t => `
                        <div class="torrent">
                            <div><strong>${t.name}</strong></div>
                            <div>Progress: ${t.progress}</div>
                            <div class="eta">ETA: ${t.eta}</div>
                        </div>
                    `).join('');
                } else {
                    <!-- USER-FACING -->
                    progressDiv.innerHTML = "<em>No active downloads.</em>";
                }
            } catch (err) {
                progressDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        }
        document.getElementById('refresh-progress').addEventListener('click', loadProgress);

        // Cancel
        document.getElementById('cancel-btn').addEventListener('click', async function() {
            const msgDiv = document.getElementById('cancel-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Cancelling...";
            try {
                const resp = await fetch(`${API_BASE}/cancel`, { method: "POST" });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (resp.ok) {
                    const cancelled = data.cancelled || [];
                    const names = cancelled.length
                        <!-- USER-FACING -->
                        ? `Cancelled: ${cancelled.join(", ")}`
                        <!-- USER-FACING -->
                        : "Nothing to cancel.";
                    msgDiv.innerHTML = `<span class="success">${names}</span>`;
                    loadProgress();
                } else {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Failed to cancel"}</span>`;
                }
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        // --- My Media -------------------------------------------------
        // The Account's own Downloads (GET /media, scoped by the Session):
        // In-flight ones show progress and can be cancelled individually;
        // completed ones can be deleted (frees quota), renamed, or moved
        // to another Category. Refusals from the guards (Protected Path /
        // Active Torrent, quota, ownership) render inline on this page.
        async function loadMedia() {
            const list = document.getElementById('media-list');
            list.innerHTML = "Loading...";
            try {
                const resp = await fetch(`${API_BASE}/media`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                const downloads = data.downloads || [];
                if (!downloads.length) {
                    <!-- USER-FACING -->
                    list.innerHTML = "<em>No media yet. Download something!</em>";
                    return;
                }
                list.innerHTML = downloads.map(d => {
                    const info = d.status === "in_flight"
                        <!-- USER-FACING -->
                        ? `<div class="torrent-info">In-flight &nbsp;|&nbsp; Progress: ${d.progress || "…"} &nbsp;|&nbsp; ETA: ${d.eta || "…"}</div>`
                        : `<div class="torrent-info">${d.category} &nbsp;|&nbsp; ${fmtGB(d.size_bytes)}</div>`;
                    const actions = d.status === "in_flight"
                        <!-- USER-FACING -->
                        ? `<button onclick="cancelDownload(${d.id})">Cancel</button>`
                        <!-- USER-FACING -->
                        : `<button onclick="deleteDownload(${d.id})">Delete</button>
                           <button onclick="renameDownload(${d.id})">Rename</button>
                           <button onclick="moveDownload(${d.id})">Move to Category</button>`;
                    <!-- USER-FACING -->
                    return `
                        <div class="torrent">
                            <div><strong>${d.name || "(unnamed download)"}</strong></div>
                            ${info}
                            <div>${actions}</div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                list.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        }
        document.getElementById('refresh-media').addEventListener('click', loadMedia);

        async function mediaAction(id, action, body) {
            // One inline error surface for every My Media operation: the
            // API's refusal detail (Protected Path, quota, ownership) is
            // shown on the page, not swallowed.
            const msgDiv = document.getElementById('mymedia-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Working...";
            try {
                const resp = await fetch(`${API_BASE}/media/${id}/${action}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body || {})
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json().catch(() => ({}));
                if (resp.ok) {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="success">${data.detail || "Done."}</span>`;
                    loadMedia();
                    loadQuota();
                } else {
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${data.detail || "Failed"}</span>`;
                }
            } catch (err) {
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        }

        window.cancelDownload = function(id) {
            return mediaAction(id, "cancel");
        }

        window.deleteDownload = function(id) {
            <!-- USER-FACING -->
            if (confirm("Delete this download and its files?")) {
                return mediaAction(id, "delete");
            }
        }

        window.renameDownload = function(id) {
            <!-- USER-FACING -->
            const name = prompt("New name:");
            if (name && name.trim()) {
                return mediaAction(id, "rename", { name: name.trim() });
            }
        }

        window.moveDownload = function(id) {
            <!-- USER-FACING -->
            const category = prompt("Move to Category (Movie, TV Show, Audiobook, Other):", "Movie");
            if (category && category.trim()) {
                return mediaAction(id, "move", { category: category.trim() });
            }
        }

        // Helper: Copy magnet link
        window.copyMagnet = function(magnet) {
            navigator.clipboard.writeText(magnet);
            <!-- USER-FACING -->
        }
        // Helper: Prefill download form from a search result, carrying the
        // result's Torznab size and title into the submission.
        window.prefillDownload = function(resultIndex) {
            const result = searchResults[resultIndex];
            if (!result) return;
            document.getElementById('magnet-link').value = result.magnet_link;
            pendingSizeBytes = Math.round(Number(result.size_gb || 0) * (1024 ** 3));
            pendingTitle = result.title;
        }
    </script>
</body>
</html>
