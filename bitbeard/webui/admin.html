<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- USER-FACING -->
    <title>Bitbeard Admin</title>
    <link href="https://fonts.googleapis.com/css?family=Pirata+One|Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
        }
        header {
            background: #0f172a;
            color: #fbbf24;
            padding: 24px 0 18px 0;
            text-align: center;
            box-shadow: 0 4px 24px #0004;
        }
        .logo {
            font-family: 'Pirata One', cursive;
            font-size: 2.6rem;
            letter-spacing: 2px;
            color: #fbbf24;
            text-shadow: 2px 4px 0 #000a, 0 0 8px #fbbf2440;
        }
        .subtitle {
            font-size: 1rem;
            color: #f1f5f9;
            letter-spacing: 1px;
            margin-top: 0.2em;
        }
        main {
            max-width: 960px;
            margin: 28px auto 0 auto;
            padding: 0 16px 40px 16px;
        }
        .userbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: #f1f5f9;
            font-size: 0.95em;
            margin-bottom: 14px;
        }
        .userbar button {
            width: auto;
            padding: 6px 16px;
            font-size: 0.9em;
            background: #334155;
            color: #fbbf24;
            border-radius: 5px;
        }
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        nav button {
            width: auto;
            margin-top: 0;
            padding: 8px 18px;
            font-size: 0.98em;
            background: #334155;
            color: #fbbf24;
            border-radius: 5px;
        }
        nav button.active {
            background: #fbbf24;
            color: #0f172a;
        }
        nav button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .section {
            background: #f1f5f9;
            padding: 28px 24px 22px 24px;
            margin-bottom: 36px;
            border-radius: 14px;
            box-shadow: 0 2px 16px #0002;
            border: 1.5px solid #e2e8f0;
        }
        h2 {
            color: #0f172a;
            font-size: 1.35rem;
            margin-bottom: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        label {
            display: block;
            margin-top: 12px;
            color: #334155;
            font-weight: 500;
        }
        input, select, button {
            margin-top: 7px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1.5px solid #cbd5e1;
            width: 100%;
            font-size: 1rem;
            font-family: inherit;
            background: #fff;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border: 1.5px solid #fbbf24;
            outline: none;
        }
        button {
            width: auto;
            background: linear-gradient(90deg, #fbbf24 60%, #f59e42 100%);
            color: #0f172a;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 10px 28px;
            margin-top: 18px;
            box-shadow: 0 2px 8px #fbbf2420;
        }
        button:hover {
            background: linear-gradient(90deg, #f59e42 60%, #fbbf24 100%);
            color: #fff;
        }
        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filters div {
            flex: 1 1 160px;
        }
        .filters button {
            flex: 0 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            font-size: 0.95em;
        }
        th {
            text-align: left;
            color: #0f172a;
            border-bottom: 2px solid #cbd5e1;
            padding: 8px 10px;
        }
        td {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 10px;
            vertical-align: top;
            color: #334155;
        }
        td.actor, td.action {
            white-space: nowrap;
            font-weight: 600;
        }
        td.details {
            word-break: break-all;
            color: #64748b;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }
        .pagination button {
            min-width: 90px;
            background: #334155;
            color: #fbbf24;
            font-size: 1em;
            padding: 7px 18px;
            border-radius: 5px;
            margin: 0 4px;
        }
        .pagination button:hover {
            background: #fbbf24;
            color: #0f172a;
        }
        .pagination button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        #page-info {
            flex: 1;
            text-align: center;
            color: #0f172a;
            font-weight: 500;
        }
        .success { color: #22c55e; font-weight: 600; }
        .error { color: #ef4444; font-weight: 600; }
        .hidden { display: none !important; }
        .badge-disabled { color: #ef4444; font-weight: 700; }
        .badge-enabled { color: #22c55e; }
        td button {
            width: auto;
            margin: 2px 4px 2px 0;
            padding: 4px 10px;
            font-size: 0.85em;
            background: #334155;
            color: #fbbf24;
            box-shadow: none;
        }
        td button:hover {
            background: #fbbf24;
            color: #0f172a;
        }
        .inline-quota {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .inline-quota select, .inline-quota input {
            margin-top: 0;
            padding: 4px 6px;
            font-size: 0.85em;
            width: auto;
        }
        .login-card {
            max-width: 420px;
            margin: 60px auto 0 auto;
        }
        @media (max-width: 700px) {
            main { max-width: 98vw; }
            .section { padding: 18px 6vw 16px 6vw; }
        }
    </style>
</head>
<body>
    <header>
        <!-- USER-FACING -->
        <div class="logo">Bitbeard</div>
        <!-- USER-FACING -->
        <div class="subtitle">Admin Panel</div>
    </header>
    <main>
        <!-- Shown whenever the API refuses the Session (not logged in /
             expired) or the caller holds a non-Admin Role. -->
        <div class="section login-card" id="login-view">
            <!-- USER-FACING -->
            <h2>Log in</h2>
            <form id="login-form" autocomplete="off">
                <!-- USER-FACING -->
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" required autocomplete="username">
                <!-- USER-FACING -->
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required autocomplete="current-password">
                <!-- USER-FACING -->
                <button type="submit">Log in</button>
                <div id="login-message"></div>
            </form>
        </div>

        <div id="app-view" class="hidden">
            <div class="userbar">
                <span id="userbar-info"></span>
                <!-- USER-FACING -->
                <button id="logout-btn">Log out</button>
            </div>

            <!-- One button per Admin Panel page. -->
            <nav id="nav">
                <!-- USER-FACING -->
                <button data-page="audit" class="active">Audit Ledger</button>
                <!-- USER-FACING -->
                <button data-page="users">Users</button>
                <!-- USER-FACING -->
                <button data-page="subsystems">Subsystems</button>
                <!-- USER-FACING -->
                <button data-page="files">Files</button>
                <!-- USER-FACING -->
                <button data-page="vpn">VPN</button>
            </nav>

            <div class="section page" id="page-audit">
                <!-- USER-FACING -->
                <h2>Audit Ledger</h2>
                <form id="audit-filters" autocomplete="off">
                    <div class="filters">
                        <div>
                            <!-- USER-FACING -->
                            <label for="filter-actor">Actor:</label>
                            <!-- USER-FACING -->
                            <input type="text" id="filter-actor" placeholder="e.g. admin or discord:name">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="filter-action">Action:</label>
                            <!-- USER-FACING -->
                            <input type="text" id="filter-action" placeholder="e.g. search, login">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="filter-start">From:</label>
                            <input type="date" id="filter-start">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="filter-end">To:</label>
                            <input type="date" id="filter-end">
                        </div>
                        <!-- USER-FACING -->
                        <button type="submit">Apply filters</button>
                        <!-- USER-FACING -->
                        <button type="button" id="clear-filters">Clear</button>
                    </div>
                </form>
                <table>
                    <thead>
                        <tr>
                            <!-- USER-FACING -->
                            <th>Timestamp</th>
                            <!-- USER-FACING -->
                            <th>Actor</th>
                            <!-- USER-FACING -->
                            <th>Action</th>
                            <!-- USER-FACING -->
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="audit-rows"></tbody>
                </table>
                <div class="pagination">
                    <!-- USER-FACING -->
                    <button id="prev-page">&lt; Prev</button>
                    <span id="page-info"></span>
                    <!-- USER-FACING -->
                    <button id="next-page">Next &gt;</button>
                </div>
            </div>

            <div class="section page hidden" id="page-users">
                <!-- USER-FACING -->
                <h2>Accounts</h2>
                <form id="user-create-form" autocomplete="off">
                    <div class="filters">
                        <div>
                            <!-- USER-FACING -->
                            <label for="new-username">Username:</label>
                            <input type="text" id="new-username" autocomplete="off">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="new-password">Password:</label>
                            <input type="password" id="new-password" autocomplete="new-password">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="new-role">Role:</label>
                            <select id="new-role">
                                <!-- USER-FACING -->
                                <option value="user">User</option>
                                <!-- USER-FACING -->
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="new-quota-mode">Storage Quota:</label>
                            <select id="new-quota-mode">
                                <!-- USER-FACING -->
                                <option value="default">Global default</option>
                                <!-- USER-FACING -->
                                <option value="override">Override</option>
                                <!-- USER-FACING -->
                                <option value="unlimited">Unlimited</option>
                            </select>
                        </div>
                        <div class="hidden" id="new-quota-wrap">
                            <!-- USER-FACING -->
                            <label for="new-quota-gb">Override (GB):</label>
                            <input type="number" id="new-quota-gb" min="0" step="0.001">
                        </div>
                        <!-- USER-FACING -->
                        <button type="submit">Create Account</button>
                    </div>
                    <div id="create-message"></div>
                </form>
                <table>
                    <thead>
                        <tr>
                            <!-- USER-FACING -->
                            <th>Username</th>
                            <!-- USER-FACING -->
                            <th>Role</th>
                            <!-- USER-FACING -->
                            <th>Status</th>
                            <!-- USER-FACING -->
                            <th>Discord</th>
                            <!-- USER-FACING -->
                            <th>Storage Quota</th>
                            <!-- USER-FACING -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-rows"></tbody>
                </table>
                <div id="users-message"></div>
            </div>

            <div class="section page hidden" id="page-subsystems">
                <!-- USER-FACING -->
                <h2>Subsystems</h2>
                <table>
                    <thead>
                        <tr>
                            <!-- USER-FACING -->
                            <th>Subsystem</th>
                            <!-- USER-FACING -->
                            <th>State</th>
                            <!-- USER-FACING -->
                            <th>Reachability</th>
                            <!-- USER-FACING -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="service-rows"></tbody>
                </table>
                <div id="services-message"></div>
            </div>

            <div class="section page hidden" id="page-files">
                <!-- USER-FACING -->
                <h2>Media Root Files</h2>
                <div class="filters">
                    <div>
                        <!-- USER-FACING -->
                        <label for="files-path">Current path:</label>
                        <span id="files-path"></span>
                    </div>
                    <!-- USER-FACING -->
                    <button type="button" id="files-up">Up one level</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <!-- USER-FACING -->
                            <th>Name</th>
                            <!-- USER-FACING -->
                            <th>Type</th>
                            <!-- USER-FACING -->
                            <th>Size</th>
                            <!-- USER-FACING -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-rows"></tbody>
                </table>
                <div id="files-message"></div>
            </div>

            <div class="section page hidden" id="page-vpn">
                <!-- USER-FACING -->
                <h2>VPN (gluetun)</h2>
                <form id="vpn-config-form" autocomplete="off">
                    <div class="filters">
                        <div>
                            <!-- USER-FACING -->
                            <label for="vpn-provider">Provider:</label>
                            <!-- USER-FACING -->
                            <input type="text" id="vpn-provider" placeholder="e.g. nordvpn">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="vpn-user">OpenVPN user:</label>
                            <input type="text" id="vpn-user" autocomplete="off">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="vpn-password">OpenVPN password:</label>
                            <!-- USER-FACING -->
                            <input type="password" id="vpn-password" autocomplete="new-password" placeholder="(unchanged)">
                        </div>
                        <div>
                            <!-- USER-FACING -->
                            <label for="vpn-server">Server:</label>
                            <!-- USER-FACING -->
                            <input type="text" id="vpn-server" placeholder="e.g. us9723.nordvpn.com">
                        </div>
                    </div>
                    <!-- USER-FACING -->
                    <button type="submit">Save &amp; apply (restarts gluetun)</button>
                    <div id="vpn-config-message"></div>
                </form>
                <table>
                    <thead>
                        <tr>
                            <!-- USER-FACING -->
                            <th>Setting</th>
                            <!-- USER-FACING -->
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody id="vpn-status-rows"></tbody>
                </table>
                <!-- USER-FACING -->
                <button type="button" id="vpn-test">Test exit IP</button>
                <div id="vpn-test-message"></div>
            </div>
        </div>
    </main>
    <script>
        // --- API base is fixed to same-origin reverse proxy ---
        const API_BASE = "/api";
        const PAGE_SIZE = 50;

        const loginView = document.getElementById('login-view');
        const appView = document.getElementById('app-view');

        function showLogin() {
            appView.classList.add('hidden');
            loginView.classList.remove('hidden');
        }

        async function showApp() {
            try {
                const resp = await fetch(`${API_BASE}/auth/me`);
                if (!resp.ok) {
                    showLogin();
                    return;
                }
                const me = await resp.json();
                if (me.role !== 'admin') {
                    // The Role is enforced by the API; the panel only
                    // explains a refusal it receives.
                    document.getElementById('login-message').innerHTML =
                        <!-- USER-FACING -->
                        `<span class="error">Admin Role required.</span>`;
                    showLogin();
                    return;
                }
                document.getElementById('userbar-info').textContent =
                    <!-- USER-FACING -->
                    `Logged in as ${me.username} (${me.role})`;
                loginView.classList.add('hidden');
                appView.classList.remove('hidden');
                showPage('audit');
            } catch (err) {
                showLogin();
            }
        }

        // Route any 401/403 from a data call back to the login page.
        function handleAuthFailure(resp) {
            if (resp.status === 401 || resp.status === 403) {
                showLogin();
                return true;
            }
            return false;
        }

        function esc(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('login-message');
            <!-- USER-FACING -->
            msgDiv.textContent = "Logging in...";
            try {
                const resp = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                if (resp.ok) {
                    msgDiv.textContent = "";
                    showApp();
                } else {
                    const data = await resp.json().catch(() => ({}));
                    <!-- USER-FACING -->
                    msgDiv.innerHTML = `<span class="error">${esc(data.detail || "Login failed")}</span>`;
                }
            } catch (err) {
                <!-- USER-FACING -->
                msgDiv.innerHTML = `<span class="error">Error: ${err}</span>`;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async function() {
            await fetch(`${API_BASE}/auth/logout`, { method: "POST" }).catch(() => {});
            showLogin();
        });

        // --- Audit Ledger ---------------------------------------------
        let offset = 0;
        let total = 0;

        function readFilters() {
            return {
                actor: document.getElementById('filter-actor').value.trim(),
                action: document.getElementById('filter-action').value.trim(),
                start: document.getElementById('filter-start').value,
                end: document.getElementById('filter-end').value,
            };
        }

        async function loadLedger() {
            const filters = readFilters();
            const params = new URLSearchParams();
            if (filters.actor) params.set('actor', filters.actor);
            if (filters.action) params.set('action', filters.action);
            if (filters.start) params.set('start', filters.start);
            if (filters.end) params.set('end', filters.end);
            params.set('limit', PAGE_SIZE);
            params.set('offset', offset);

            const rows = document.getElementById('audit-rows');
            try {
                const resp = await fetch(`${API_BASE}/admin/audit?${params}`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    rows.innerHTML = `<tr><td colspan="4"><span class="error">${esc(data.detail || "Failed to load the ledger")}</span></td></tr>`;
                    return;
                }
                total = data.total;
                rows.innerHTML = data.entries.map(entry => `
                    <tr>
                        <td>${esc(entry.ts)}</td>
                        <td class="actor">${esc(entry.actor)}</td>
                        <td class="action">${esc(entry.action)}</td>
                        <td class="details">${esc(entry.details ? JSON.stringify(entry.details) : "")}</td>
                    </tr>
                `).join('');
                renderPagination();
            } catch (err) {
                <!-- USER-FACING -->
                rows.innerHTML = `<tr><td colspan="4"><span class="error">Error: ${esc(err)}</span></td></tr>`;
            }
        }

        function renderPagination() {
            const prevBtn = document.getElementById('prev-page');
            const nextBtn = document.getElementById('next-page');
            const pageInfo = document.getElementById('page-info');
            prevBtn.disabled = offset <= 0;
            nextBtn.disabled = offset + PAGE_SIZE >= total;
            if (total === 0) {
                <!-- USER-FACING -->
                pageInfo.textContent = "No entries match.";
            } else {
                const first = offset + 1;
                const last = Math.min(offset + PAGE_SIZE, total);
                <!-- USER-FACING -->
                pageInfo.textContent = `Entries ${first}–${last} of ${total}`;
            }
        }

        document.getElementById('audit-filters').addEventListener('submit', function(e) {
            e.preventDefault();
            offset = 0;
            loadLedger();
        });

        document.getElementById('clear-filters').addEventListener('click', function() {
            document.getElementById('filter-actor').value = "";
            document.getElementById('filter-action').value = "";
            document.getElementById('filter-start').value = "";
            document.getElementById('filter-end').value = "";
            offset = 0;
            loadLedger();
        });

        document.getElementById('prev-page').addEventListener('click', function() {
            if (offset > 0) {
                offset = Math.max(0, offset - PAGE_SIZE);
                loadLedger();
            }
        });

        document.getElementById('next-page').addEventListener('click', function() {
            if (offset + PAGE_SIZE < total) {
                offset += PAGE_SIZE;
                loadLedger();
            }
        });

        // --- Subsystems page -------------------------------------------
        function describeState(svc) {
            <!-- USER-FACING -->
            if (svc.disabled) return `<span class="badge-disabled">Disabled</span>`;
            const label = esc(svc.state);
            if (svc.state === 'running') return `<span class="badge-enabled">${label}</span>`;
            if (svc.state === 'absent') return `<span class="badge-disabled">${label}</span>`;
            return esc(svc.state);
        }

        function describeProbe(svc) {
            if (svc.port === null || svc.probe === null) return "—";
            <!-- USER-FACING -->
            const what = `Port ${svc.port}`;
            return svc.probe
                <!-- USER-FACING -->
                ? `<span class="badge-enabled">${what} open</span>`
                <!-- USER-FACING -->
                : `<span class="badge-disabled">${what} closed</span>`;
        }

        function renderServiceRow(svc) {
            let actions = ['restart', 'stop', 'start'].map(action =>
                <!-- USER-FACING -->
                `<button data-action="${action}" data-name="${esc(svc.name)}">${action[0].toUpperCase() + action.slice(1)}</button>`
            ).join('');
            if (svc.optional) {
                actions += svc.disabled
                    <!-- USER-FACING -->
                    ? `<button data-action="enable" data-name="${esc(svc.name)}">Enable</button>`
                    <!-- USER-FACING -->
                    : `<button data-action="disable" data-name="${esc(svc.name)}">Disable</button>`;
            }
            return `
                <tr>
                    <td class="actor">${esc(svc.name)}</td>
                    <td>${describeState(svc)}</td>
                    <td>${describeProbe(svc)}</td>
                    <td>${actions}</td>
                </tr>`;
        }

        async function loadServices() {
            const rows = document.getElementById('service-rows');
            try {
                const resp = await fetch(`${API_BASE}/admin/services`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    rows.innerHTML = `<tr><td colspan="4"><span class="error">${esc(data.detail || "Failed to load Subsystems")}</span></td></tr>`;
                    return;
                }
                rows.innerHTML = data.services.map(renderServiceRow).join('');
            } catch (err) {
                rows.innerHTML = `<tr><td colspan="4"><span class="error">Error: ${esc(err)}</span></td></tr>`;
            }
        }

        // Every per-Subsystem action: one delegated listener, one reload.
        document.getElementById('service-rows').addEventListener('click', async function(e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const name = btn.dataset.name;
            const action = btn.dataset.action;
            const msgId = 'services-message';
            try {
                const resp = await fetch(`${API_BASE}/admin/services/${name}/${action}`, { method: "POST" });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json().catch(() => ({}));
                if (resp.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, `Subsystem '${name}': ${action} done.`);
                } else {
                    <!-- USER-FACING -->
                    flash(msgId, data.detail || "The action was refused.", true);
                }
                loadServices();
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
            }
        });

        // --- Files page (ticket #10) -----------------------------------
        // Relative paths under the Media Root, "/"-separated — the shape
        // the manager's file browser speaks.
        let filesPath = "";

        function joinPath(dir, name) {
            return dir ? `${dir}/${name}` : name;
        }

        function parentPath(path) {
            const idx = path.lastIndexOf('/');
            return idx === -1 ? "" : path.slice(0, idx);
        }

        async function loadFiles(path = filesPath) {
            filesPath = path;
            const rows = document.getElementById('file-rows');
            try {
                const resp = await fetch(
                    `${API_BASE}/admin/files?path=${encodeURIComponent(path)}`
                );
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    rows.innerHTML = `<tr><td colspan="4"><span class="error">${esc(data.detail || "Failed to list the Media Root")}</span></td></tr>`;
                    return;
                }
                document.getElementById('files-path').textContent = `/${data.path}`;
                document.getElementById('files-up').disabled = data.path === "";
                if (!data.entries.length) {
                    <!-- USER-FACING -->
                    rows.innerHTML = `<tr><td colspan="4" class="details">Empty directory.</td></tr>`;
                    return;
                }
                rows.innerHTML = data.entries.map(entry => {
                    const path = joinPath(data.path, entry.name);
                    <!-- USER-FACING -->
                    return `
                    <tr>
                        <td class="actor">${entry.is_dir
                            ? `<a href="#" class="dir-link" data-path="${esc(path)}">${esc(entry.name)}/</a>`
                            : esc(entry.name)}</td>
                        <td>${entry.is_dir ? "Directory" : "File"}</td>
                        <td>${entry.is_dir ? "—" : formatBytes(entry.size_bytes)}</td>
                        <td>
                            <button data-file-op="delete" data-path="${esc(path)}">Delete</button>
                            <button data-file-op="rename" data-path="${esc(path)}">Rename</button>
                            <button data-file-op="move" data-path="${esc(path)}">Move</button>
                        </td>
                    </tr>`;
                }).join('');
            } catch (err) {
                rows.innerHTML = `<tr><td colspan="4"><span class="error">Error: ${esc(err)}</span></td></tr>`;
            }
        }

        document.getElementById('files-up').addEventListener('click', function() {
            loadFiles(parentPath(filesPath));
        });

        // One delegated listener: directory navigation and the three
        // per-entry operations, with inline refusal errors.
        document.getElementById('file-rows').addEventListener('click', async function(e) {
            const link = e.target.closest('a.dir-link');
            if (link) {
                e.preventDefault();
                loadFiles(link.dataset.path);
                return;
            }
            const btn = e.target.closest('button[data-file-op]');
            if (!btn) return;
            const path = btn.dataset.path;
            const op = btn.dataset.fileOp;
            const msgId = 'files-message';

            let body;
            if (op === 'delete') {
                <!-- USER-FACING -->
                if (!confirm(`Hard-delete ${path}? This cannot be undone.`)) return;
                body = { path };
            } else if (op === 'rename') {
                <!-- USER-FACING -->
                const name = prompt(`New name for ${path}:`);
                if (!name) return;
                body = { path, new_name: name.trim() };
            } else if (op === 'move') {
                const dir = prompt(
                    <!-- USER-FACING -->
                    `Move ${path} to which directory inside the Media Root?\n(e.g. Movie, or TV Show/Season 1)`,
                    parentPath(path)
                );
                if (dir === null) return;
                body = { path, target_dir: dir.trim() };
            }

            try {
                const resp = await fetch(`${API_BASE}/admin/files/${op}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json().catch(() => ({}));
                if (resp.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, op === 'delete' ? `Deleted ${path}.`
                        <!-- USER-FACING -->
                        : op === 'rename' ? `Renamed ${path} to ${data.to}.`
                        <!-- USER-FACING -->
                        : `Moved ${path} to ${data.to}.`);
                } else {
                    // Protected Paths, sandbox escapes and taken targets
                    // arrive as the manager's refusal, shown inline.
                    <!-- USER-FACING -->
                    flash(msgId, data.detail || "The operation was refused.", true);
                }
                loadFiles();
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
            }
        });

        // --- VPN page (ticket #10) -------------------------------------
        function renderVpnStatus(vpn) {
            document.getElementById('vpn-provider').value = vpn.provider || "";
            document.getElementById('vpn-user').value = vpn.openvpn_user || "";
            document.getElementById('vpn-server').value = vpn.server || "";
            <!-- USER-FACING -->
            document.getElementById('vpn-status-rows').innerHTML = `
                <tr><td class="actor">Provider</td><td>${esc(vpn.provider || "—")}</td></tr>
                <tr><td class="actor">Server</td><td>${esc(vpn.server || "—")}</td></tr>
                <tr><td class="actor">Current egress IP</td><td>${esc(vpn.egress_ip || "unknown (probe failed)")}</td></tr>`;
        }

        async function loadVpnStatus() {
            try {
                const resp = await fetch(`${API_BASE}/admin/vpn/status`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    flash('vpn-config-message', data.detail || "Failed to load VPN status.", true);
                    return;
                }
                renderVpnStatus(data);
            } catch (err) {
                flash('vpn-config-message', `Error: ${err}`, true);
            }
        }

        document.getElementById('vpn-config-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgId = 'vpn-config-message';
            // An empty field means "leave it unchanged" (null); the API
            // refuses a field that was provided but blank.
            const body = {
                provider: document.getElementById('vpn-provider').value.trim() || null,
                openvpn_user: document.getElementById('vpn-user').value.trim() || null,
                openvpn_password: document.getElementById('vpn-password').value || null,
                server: document.getElementById('vpn-server').value.trim() || null,
            };
            try {
                const resp = await fetch(`${API_BASE}/admin/vpn/config`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, data.detail || "Could not save the VPN settings.", true);
                    return;
                }
                <!-- USER-FACING -->
                flash(msgId, "VPN settings saved; restarting gluetun to apply...");
                // Applying the change needs a gluetun restart — the same
                // Subsystems action the Subsystems page uses.
                const restart = await fetch(`${API_BASE}/admin/services/gluetun/restart`, { method: "POST" });
                if (handleAuthFailure(restart)) return;
                const restartData = await restart.json().catch(() => ({}));
                if (restart.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, "VPN settings saved; gluetun restarted.");
                } else {
                    <!-- USER-FACING -->
                    flash(msgId, restartData.detail || "Settings saved, but the gluetun restart was refused.", true);
                }
                document.getElementById('vpn-password').value = "";
                loadVpnStatus();
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
            }
        });

        document.getElementById('vpn-test').addEventListener('click', async function() {
            const msgId = 'vpn-test-message';
            try {
                const resp = await fetch(`${API_BASE}/admin/vpn/test`, { method: "POST" });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (resp.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, `Current egress IP: ${data.egress_ip || "unknown (probe failed)"}`);
                } else {
                    <!-- USER-FACING -->
                    flash(msgId, data.detail || "The test failed.", true);
                }
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
            }
        });

        // --- Panel page routing ---------------------------------------

        function showPage(name) {
            document.querySelectorAll('#nav button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.page === name);
            });
            document.querySelectorAll('.page').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(`page-${name}`).classList.remove('hidden');
            if (name === 'audit') loadLedger();
            else if (name === 'users') loadUsers();
            else if (name === 'subsystems') loadServices();
            else if (name === 'files') loadFiles();
            else if (name === 'vpn') loadVpnStatus();
        }

        document.querySelectorAll('#nav button:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });

        // --- Accounts (Users page) -------------------------------------
        const GIB = 1024 ** 3;

        function flash(id, text, isError) {
            const el = document.getElementById(id);
            el.innerHTML = text
                ? `<span class="${isError ? 'error' : 'success'}">${esc(text)}</span>`
                : "";
        }

        function formatBytes(bytes) {
            <!-- USER-FACING -->
            if (bytes === null || bytes === undefined) return "—";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let size = bytes;
            for (const unit of units) {
                if (size < 1024 || unit === "TB") {
                    <!-- USER-FACING -->
                    return unit === "B" ? `${size} B` : `${size.toFixed(2)} ${unit}`;
                }
                size /= 1024;
            }
        }

        // Quota state as the API shapes it: exempt (Admin), unlimited,
        // a per-Account override, or the global default.
        function describeQuota(account) {
            const q = account.quota;
            <!-- USER-FACING -->
            if (q.exempt) return "Exempt (Admin)";
            <!-- USER-FACING -->
            if (q.unlimited) return "Unlimited";
            return q.override_bytes !== null
                <!-- USER-FACING -->
                ? `Override (${formatBytes(q.cap_bytes)})`
                <!-- USER-FACING -->
                : `Default (${formatBytes(q.cap_bytes)})`;
        }

        function usageVsCap(account) {
            const q = account.quota;
            <!-- USER-FACING -->
            const cap = q.cap_bytes === null ? "no cap" : formatBytes(q.cap_bytes);
            <!-- USER-FACING -->
            return `${formatBytes(q.used_bytes)} / ${cap}`;
        }

        function describeDiscord(account) {
            <!-- USER-FACING -->
            if (account.discord_id) return `Linked: ${account.discord_id}`;
            if (account.link_code) {
                <!-- USER-FACING -->
                return `Pending code: ${account.link_code.code} (claims ${account.link_code.discord_id})`;
            }
            <!-- USER-FACING -->
            return "—";
        }

        function renderUserRow(account) {
            const quotaControls = account.quota.exempt
                <!-- USER-FACING -->
                ? "—"
                <!-- USER-FACING -->
                : `
                <span class="inline-quota">
                    <select data-quota-mode="${account.id}">
                        <option value="default">Default</option>
                        <option value="override">Override (GB)</option>
                        <option value="unlimited">Unlimited</option>
                    </select>
                    <input type="number" min="0" step="0.001"
                           data-quota-gb="${account.id}"
                           placeholder="GB" style="display:none">
                    <button data-action="set-quota" data-id="${account.id}">Set</button>
                </span>`;
            const status = account.disabled
                <!-- USER-FACING -->
                ? `<span class="badge-disabled">Disabled</span>`
                <!-- USER-FACING -->
                : `<span class="badge-enabled">Enabled</span>`;
            <!-- USER-FACING -->
            return `
                <tr>
                    <td class="actor">${esc(account.username)}</td>
                    <td>${esc(account.role)}</td>
                    <td>${status}</td>
                    <td class="details">${esc(describeDiscord(account))}</td>
                    <td>${esc(describeQuota(account))}<br>
                        <span class="details">${esc(usageVsCap(account))}</span></td>
                    <td>
                        <button data-action="reset" data-id="${account.id}" data-username="${esc(account.username)}">Reset password</button>
                        <button data-action="${account.disabled ? 'enable' : 'disable'}" data-id="${account.id}">${account.disabled ? 'Enable' : 'Disable'}</button>
                        <button data-action="revoke" data-id="${account.id}">Revoke sessions</button>
                        ${quotaControls}
                    </td>
                </tr>`;
        }

        async function loadUsers() {
            const rows = document.getElementById('user-rows');
            try {
                const resp = await fetch(`${API_BASE}/admin/users`);
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (!resp.ok) {
                    <!-- USER-FACING -->
                    rows.innerHTML = `<tr><td colspan="6"><span class="error">${esc(data.detail || "Failed to load Accounts")}</span></td></tr>`;
                    return;
                }
                rows.innerHTML = data.users.map(renderUserRow).join('');
            } catch (err) {
                rows.innerHTML = `<tr><td colspan="6"><span class="error">Error: ${esc(err)}</span></td></tr>`;
            }
        }

        // Toggle the override GB fields with the mode: per-row selects
        // via delegation (rows re-render after every reload), the create
        // form via its own listener below.
        document.getElementById('user-rows').addEventListener('change', function(e) {
            const modeSelect = e.target.closest('select[data-quota-mode]');
            if (!modeSelect) return;
            const input = document.querySelector(
                `[data-quota-gb="${modeSelect.dataset.quotaMode}"]`
            );
            input.style.display = modeSelect.value === 'override' ? "" : "none";
        });

        document.getElementById('user-create-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgId = 'create-message';
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value;
            const role = document.getElementById('new-role').value;
            const mode = document.getElementById('new-quota-mode').value;
            if (!username) {
                <!-- USER-FACING -->
                flash(msgId, "A username is required.", true);
                return;
            }
            if (password.length < 8) {
                <!-- USER-FACING -->
                flash(msgId, "Password must be at least 8 characters.", true);
                return;
            }
            let quotaBytes = null;
            if (mode === 'unlimited') {
                quotaBytes = -1;
            } else if (mode === 'override') {
                const gb = parseFloat(document.getElementById('new-quota-gb').value);
                if (isNaN(gb) || gb < 0) {
                    <!-- USER-FACING -->
                    flash(msgId, "Enter the override size in GB.", true);
                    return;
                }
                quotaBytes = Math.round(gb * GIB);
            }
            try {
                const resp = await fetch(`${API_BASE}/admin/users`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username, password, role, quota_bytes: quotaBytes
                    })
                });
                if (handleAuthFailure(resp)) return;
                const data = await resp.json();
                if (resp.ok) {
                    <!-- USER-FACING -->
                    flash(msgId, `Account '${username}' created.`);
                    this.reset();
                    loadUsers();
                } else {
                    <!-- USER-FACING -->
                    flash(msgId, data.detail || "Could not create the Account.", true);
                }
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
            }
        });

        // Every per-Account action: one delegated listener, one reload.
        document.getElementById('user-rows').addEventListener('click', async function(e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            const msgId = 'users-message';

            const post = (path, body) => fetch(`${API_BASE}/admin/users/${id}/${path}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: body === undefined ? undefined : JSON.stringify(body)
            });

            let resp;
            try {
                if (action === 'reset') {
                    <!-- USER-FACING -->
                    const password = prompt(`New password for ${btn.dataset.username} (min 8 characters):`);
                    if (!password) return;
                    if (password.length < 8) {
                        <!-- USER-FACING -->
                        flash(msgId, "Password must be at least 8 characters.", true);
                        return;
                    }
                    resp = await post('reset', { new_password: password });
                } else if (action === 'disable' || action === 'enable') {
                    resp = await post(action);
                } else if (action === 'revoke') {
                    resp = await post('revoke_sessions');
                } else if (action === 'set-quota') {
                    const mode = document.querySelector(`[data-quota-mode="${id}"]`).value;
                    let quotaBytes;
                    if (mode === 'default') quotaBytes = null;
                    else if (mode === 'unlimited') quotaBytes = -1;
                    else {
                        const gb = parseFloat(document.querySelector(`[data-quota-gb="${id}"]`).value);
                        if (isNaN(gb) || gb < 0) {
                            <!-- USER-FACING -->
                            flash(msgId, "Enter the override size in GB.", true);
                            return;
                        }
                        quotaBytes = Math.round(gb * GIB);
                    }
                    resp = await post('quota', { quota_bytes: quotaBytes });
                }
            } catch (err) {
                flash(msgId, `Error: ${err}`, true);
                return;
            }

            if (handleAuthFailure(resp)) return;
            const data = await resp.json().catch(() => ({}));
            if (resp.ok) {
                if (action === 'revoke') {
                    <!-- USER-FACING -->
                    flash(msgId, `Revoked ${data.sessions_revoked} session(s).`);
                } else if (action === 'reset') {
                    <!-- USER-FACING -->
                    flash(msgId, data.message || "Password reset.");
                } else {
                    <!-- USER-FACING -->
                    flash(msgId, "Done.");
                }
                loadUsers();
            } else {
                <!-- USER-FACING -->
                flash(msgId, data.detail || "The action was refused.", true);
            }
        });

        // Show/hide the override GB field in the create form.
        document.getElementById('new-quota-mode').addEventListener('change', function() {
            document.getElementById('new-quota-wrap').classList.toggle(
                'hidden', this.value !== 'override'
            );
        });

        // Initial load: prove the Admin Session before revealing the panel.
        showApp();
    </script>
</body>
</html>
