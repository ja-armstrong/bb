server {
  listen 80;

  # Serve the SPA/static files.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # The Admin Panel: a second single-file SPA at /admin, same session
  # cookie (the API enforces the Admin Role on the endpoints it uses).
  location /admin {
    root /usr/share/nginx/html;
    try_files /admin.html =404;
  }

  # Reverse proxy the API under the same origin. The API now owns all
  # authentication; nginx is a dumb static/proxy layer.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:9870/;
    proxy_read_timeout 300s;
  }
}
