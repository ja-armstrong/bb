server {
  listen 80;

  # Serve the SPA/static files.
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }

  # The Admin Panel: a second single-file SPA at /admin, same session
  # cookie (the API enforces the Admin Role on the endpoints it uses).
  location /admin {
    root /usr/share/nginx/html;
    try_files /admin.html =404;
  }

  # The public Registration Request landing page: an anonymous visitor's
  # ask-for-an-account form (no Discord, no login). Submissions go to the
  # API's /register endpoint through the proxy below.
  location /register {
    root /usr/share/nginx/html;
    try_files /register.html =404;
  }

  # Reverse proxy the API under the same origin. The API now owns all
  # authentication; nginx is a dumb static/proxy layer.
  #
  # The XFF contract (docs/proxy.md): the front proxy OVERWRITES
  # X-Forwarded-For with the real client address; everything behind it
  # (this layer) passes the incoming value through VERBATIM; the API
  # reads the first (and, per the contract, only) entry. Appending here
  # ($proxy_add_x_forwarded_for) would let a client-supplied fake IP
  # ride in front of the real one and into the API's per-IP throttle
  # and Audit Ledger.
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:9870/;
    proxy_read_timeout 300s;
  }
}
