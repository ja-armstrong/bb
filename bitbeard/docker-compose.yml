services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      - 9117:9117
      - 8081:80
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=openvpn
      # Native mode (any known provider): both keys below stay empty in
      # .env and gluetun picks and authenticates servers itself from
      # VPN_SERVICE_PROVIDER + OPENVPN_USER/PASSWORD. Custom provider: the
      # wizard (or a hand edit) sets OPENVPN_CUSTOM_CONFIG to the .ovpn
      # file as this container sees it. Gluetun treats an empty-but-set
      # value exactly like an unset one, so an empty OPENVPN_CUSTOM_CONFIG
      # cannot re-enter custom mode (verified against gluetun's settings
      # reader).
      - OPENVPN_CUSTOM_CONFIG=${OPENVPN_CUSTOM_CONFIG:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - TZ=${TZ}
    volumes:
      # Carries openvpn/custom.ovpn in for the custom provider. In native
      # mode gluetun never reads the mounted path (OPENVPN_CUSTOM_CONFIG is
      # empty), so the mount is inert there; compose interpolation cannot
      # drop a volume, so it stays declared.
      - ./openvpn:/gluetun/openvpn
    restart: unless-stopped

  init-configs:
    image: alpine:3.19
    container_name: init-configs
    command: |
      sh -c '
      set -ex
      echo "Defaults tree:"; ls -la /defaults; ls -laR /defaults/jackett || true; ls -laR /defaults/qbt || true
      echo "Before copy - dest tree:"; ls -la /dest || true; ls -laR /dest/jackett || true; ls -laR /dest/qbt || true
      mkdir -p /dest/jackett/Jackett /dest/qbt/qBittorrent
      apk add --no-cache coreutils >/dev/null 2>&1 || true
      if [ ! -e /dest/jackett/Jackett/ServerConfig.json ]; then
        echo "Seeding Jackett defaults..."
        cp -av /defaults/jackett/Jackett/. /dest/jackett/Jackett/
      else
        echo "Jackett config exists, skipping seed"
      fi
      if [ ! -e /dest/qbt/qBittorrent/qBittorrent.conf ]; then
        echo "Seeding qBittorrent defaults..."
        cp -av /defaults/qbt/qBittorrent/. /dest/qbt/qBittorrent/
      else
        echo "qBittorrent config exists, skipping seed"
      fi
      echo "After copy - dest tree:"; ls -la /dest; ls -laR /dest/jackett || true; ls -laR /dest/qbt || true
      chown -R 1000:1000 /dest/jackett /dest/qbt
      '
    volumes:
      - ./defaults/jackett:/defaults/jackett:ro
      - ./defaults/qbittorrent:/defaults/qbt:ro
      - ./jackett:/dest/jackett
      - ./qbittorrent:/dest/qbt
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_started
      init-configs:
        condition: service_completed_successfully
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent:/config
      - ./media:/media
    restart: unless-stopped

  jackett:
    image: linuxserver/jackett
    container_name: jackett
    depends_on:
      gluetun:
        condition: service_started
      init-configs:
        condition: service_completed_successfully
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./jackett:/config
      - ./media:/media
    restart: unless-stopped

  plex:
    image: linuxserver/plex
    container_name: plex
    profiles: ["plex"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./plex:/config
      - ./media:/media
    ports:
      - 32400:32400
    restart: unless-stopped

  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    profiles: ["jellyfin"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./jellyfin:/config
      - ./media:/media
    ports:
      - 8096:8096
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DEFAULT_QUOTA_GB=${DEFAULT_QUOTA_GB}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS}
      - DATABASE_PATH=${DATABASE_PATH}
      - MANAGER_URL=${MANAGER_URL}
      - VPN_PROVIDER=${VPN_PROVIDER}
      # Which Optional Subsystems the stack boots; the Admin Panel derives
      # its Media Server entry from the same source of truth.
      - COMPOSE_PROFILES=${COMPOSE_PROFILES}
      # Optional Jellyfin provisioning on registration approval: on only
      # when JELLYFIN_API_TOKEN is set (token from Jellyfin's Dashboard ->
      # API Keys). The URL default reaches the host-published 8096 through
      # the host gateway extra_host below.
      - JELLYFIN_URL=${JELLYFIN_URL:-http://host.docker.internal:8096}
      - JELLYFIN_API_TOKEN=${JELLYFIN_API_TOKEN:-}
      - OPENVPN_DIR=/openvpn
    extra_hosts:
      # The api container shares gluetun's netns but keeps its own /etc/
      # hosts entry: JELLYFIN_URL's default resolves through the host
      # gateway to the Jellyfin Subsystem's host-published port.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      # The VPN settings the Admin Panel writes (api.vpn): same directory
      # the gluetun Subsystem mounts its OpenVPN config from.
      - ./openvpn:/openvpn
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: manager
    depends_on:
      gluetun:
        condition: service_started
      qbittorrent:
        condition: service_started
      jackett:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - BASE_DOWNLOAD_DIR=${BASE_DOWNLOAD_DIR}
      - JACKETT_API_KEY=${JACKETT_API_KEY}
      - API_URL=${API_URL}
      - BOT_URL=${BOT_URL}
      - DATABASE_PATH=${DATABASE_PATH}
      - QUOTA_RECONCILE_INTERVAL=${QUOTA_RECONCILE_INTERVAL}
    volumes:
      - ./data:/data
      - ./media:/media
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: bot
    profiles: ["bot"]
    depends_on:
      gluetun:
        condition: service_started
      api:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - DISCORD_ANNOUNCE_CHANNEL_ID=${DISCORD_ANNOUNCE_CHANNEL_ID}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - API_URL=${API_URL}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
    restart: unless-stopped

  webui:
    build: ./webui
    container_name: webui
    depends_on:
      gluetun:
        condition: service_started
      api:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
    restart: unless-stopped
